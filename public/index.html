<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IMEI TAC Checker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { font-family: system-ui, sans-serif; }
    .gradient-bg { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
    .slide-up { animation: slideUp 0.3s ease-out; }
    @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body class="bg-gray-900 min-h-screen flex items-center justify-center p-4">
  <div class="w-full max-w-lg">
    <div class="bg-gray-800 rounded-2xl shadow-2xl overflow-hidden">
      <div class="gradient-bg px-6 py-5 text-center text-white">
        <div class="flex items-center justify-center gap-3">
          <i class="fas fa-mobile-alt text-3xl"></i>
          <h1 class="text-2xl font-bold">IMEI TAC Checker</h1>
        </div>
        <p class="text-white/70 text-sm mt-1">Deteksi HP Refurbish & Fake Spec</p>
      </div>

      <div class="p-6">
        <form id="imeiForm" class="space-y-4">
          <div>
            <label class="block text-sm text-gray-400 mb-2"><i class="fas fa-barcode mr-2 text-purple-400"></i>Nomor IMEI (15 Digit)</label>
            <input type="text" id="imei" maxlength="15" placeholder="Contoh: 869887040000002" class="w-full px-4 py-3 bg-gray-700 border-2 border-gray-600 rounded-xl focus:border-purple-500 focus:ring-2 focus:ring-purple-500/20 outline-none text-white text-lg tracking-wider font-mono" required>
          </div>
          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-sm text-gray-400 mb-2"><i class="fas fa-memory mr-2 text-purple-400"></i>Klaim RAM</label>
              <select id="claimed_ram" class="w-full px-4 py-3 bg-gray-700 border-2 border-gray-600 rounded-xl focus:border-purple-500 outline-none text-white">
                <option value="">-- Pilih --</option>
                <option value="2">2 GB</option>
                <option value="3">3 GB</option>
                <option value="4">4 GB</option>
                <option value="6">6 GB</option>
                <option value="8">8 GB</option>
                <option value="12">12 GB</option>
              </select>
            </div>
            <div>
              <label class="block text-sm text-gray-400 mb-2"><i class="fas fa-hdd mr-2 text-purple-400"></i>Klaim Storage</label>
              <select id="claimed_rom" class="w-full px-4 py-3 bg-gray-700 border-2 border-gray-600 rounded-xl focus:border-purple-500 outline-none text-white">
                <option value="">-- Pilih --</option>
                <option value="16">16 GB</option>
                <option value="32">32 GB</option>
                <option value="64">64 GB</option>
                <option value="128">128 GB</option>
                <option value="256">256 GB</option>
              </select>
            </div>
          </div>
          <button type="submit" id="submitBtn" class="w-full gradient-bg text-white py-4 rounded-xl font-bold text-lg hover:opacity-90 transition-all flex items-center justify-center gap-2 shadow-lg">
            <i class="fas fa-search"></i><span>CEK SEKARANG</span>
          </button>
        </form>

        <div id="loading" class="hidden mt-6 text-center py-4">
          <div class="inline-flex items-center gap-2 text-purple-400">
            <i class="fas fa-spinner fa-spin text-xl"></i>
            <span>Memeriksa IMEI...</span>
          </div>
        </div>

        <div id="result" class="hidden mt-6"></div>
      </div>
    </div>
    <p class="text-center text-gray-500 text-xs mt-3"><a href="https://github.com/haxan100/cekIMei" class="text-purple-400 hover:underline">IMEI TAC Checker API</a></p>
  </div>

  <script>
    const API_URL = 'http://localhost:3000/api/v1/check-imei';
    document.getElementById('imei').addEventListener('input', function(e) { this.value = this.value.replace(/\D/g, '').slice(0, 15); });
    document.getElementById('imeiForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const imei = document.getElementById('imei').value.trim();
      const claimed_ram = document.getElementById('claimed_ram').value;
      const claimed_rom = document.getElementById('claimed_rom').value;
      if (imei.length !== 15) { showError('IMEI harus 15 digit angka'); return; }
      const body = { imei };
      if (claimed_ram) body.claimed_ram = parseInt(claimed_ram);
      if (claimed_rom) body.claimed_rom = parseInt(claimed_rom);
      document.getElementById('loading').classList.remove('hidden');
      document.getElementById('result').classList.add('hidden');
      document.getElementById('submitBtn').disabled = true;
      try {
        const response = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
        const data = await response.json();
        document.getElementById('loading').classList.add('hidden');
        document.getElementById('submitBtn').disabled = false;
        if (data.success) { showSuccessResult(data.data); } else { showErrorResult(data.error); }
      } catch (err) {
        document.getElementById('loading').classList.add('hidden');
        document.getElementById('submitBtn').disabled = false;
        showError('Server tidak dapat dijangkau. Pastikan API berjalan.');
      }
    });
    function showError(message) {
      const result = document.getElementById('result');
      result.classList.remove('hidden');
      result.innerHTML = `<div class="bg-red-900/50 border-2 border-red-500 rounded-xl p-4 text-red-300 slide-up"><i class="fas fa-exclamation-circle mr-2"></i>${message}</div>`;
    }
    function showErrorResult(error) {
      const result = document.getElementById('result');
      result.classList.remove('hidden');
      const styles = { 'INVALID_IMEI': { bg: 'bg-red-900/50', border: 'border-red-500', text: 'text-red-300', icon: 'fa-times-circle' }, 'TAC_NOT_FOUND': { bg: 'bg-yellow-900/50', border: 'border-yellow-500', text: 'text-yellow-300', icon: 'fa-question-circle' }, 'MISSING_IMEI': { bg: 'bg-red-900/50', border: 'border-red-500', text: 'text-red-300', icon: 'fa-exclamation-circle' } };
      const s = styles[error.code] || styles['INVALID_IMEI'];
      result.innerHTML = `<div class="${s.bg} border-2 ${s.border} rounded-xl p-4 ${s.text} slide-up"><div class="flex items-center gap-2 mb-1"><i class="fas ${s.icon}"></i><span class="font-bold">${error.code.replace(/_/g, ' ')}</span></div><p class="text-sm opacity-80">${error.message}</p></div>`;
    }
    function showSuccessResult(data) {
      const result = document.getElementById('result');
      result.classList.remove('hidden');
      const isHigh = data.assessment.is_refurbished_fake;
      const s = isHigh ? { bg: 'bg-red-900/50', border: 'border-red-500', badge: 'bg-red-500', icon: 'fa-exclamation-triangle', text: 'text-red-300' } : { bg: 'bg-green-900/50', border: 'border-green-500', badge: 'bg-green-500', icon: 'fa-check-circle', text: 'text-green-300' };
      const reasons = data.assessment.reasons.length > 0 ? data.assessment.reasons.map(r => `<li class="flex items-start gap-2"><i class="fas fa-chevron-right text-xs mt-1 opacity-50"></i>${r}</li>`).join('') : '<li class="opacity-70">Tidak ada masalah terdeteksi</li>';
      result.innerHTML = `
        <div class="slide-up space-y-4">
          <div class="${s.bg} border-2 ${s.border} rounded-xl p-4">
            <div class="flex items-center gap-3 mb-3">
              <i class="fas ${s.icon} text-2xl"></i>
              <span class="${s.badge} text-white text-xs font-bold px-3 py-1 rounded-full">${data.assessment.risk_level} RISK</span>
            </div>
            <p class="font-bold text-lg ${s.text}">${data.assessment.verdict}</p>
            <ul class="mt-3 space-y-1 ${s.text} text-sm">${reasons}</ul>
          </div>
          <div class="bg-gray-700/50 border border-gray-600 rounded-xl p-4">
            <h3 class="text-gray-400 text-xs uppercase tracking-wide mb-3 font-semibold"><i class="fas fa-info-circle mr-1"></i>Informasi Perangkat</h3>
            <div class="grid grid-cols-2 gap-4">
              <div>
                <p class="text-gray-500 text-xs">BRAND</p>
                <p class="text-white font-bold text-lg">${data.device_info.brand}</p>
              </div>
              <div>
                <p class="text-gray-500 text-xs">MODEL</p>
                <p class="text-white font-bold text-lg">${data.device_info.model_name || '-'}</p>
              </div>
              <div>
                <p class="text-gray-500 text-xs">MODEL CODE</p>
                <p class="text-gray-300 font-mono">${data.device_info.model_code || '-'}</p>
              </div>
              <div>
                <p class="text-gray-500 text-xs">TAC</p>
                <p class="text-gray-300 font-mono">${data.tac}</p>
              </div>
            </div>
          </div>
          <div class="grid grid-cols-2 gap-4">
            <div class="bg-gray-700/50 border border-gray-600 rounded-xl p-4">
              <h4 class="text-gray-400 text-xs uppercase tracking-wide mb-2 font-semibold"><i class="fas fa-tag mr-1"></i>Klaim Penjual</h4>
              <div class="flex justify-between text-sm"><span class="text-gray-400">RAM:</span><span class="font-bold ${isHigh ? 'text-red-400' : 'text-white'}">${data.claimed_specs.ram}</span></div>
              <div class="flex justify-between text-sm"><span class="text-gray-400">Storage:</span><span class="font-bold ${isHigh ? 'text-red-400' : 'text-white'}">${data.claimed_specs.storage}</span></div>
            </div>
            <div class="bg-gray-700/50 border border-gray-600 rounded-xl p-4">
              <h4 class="text-gray-400 text-xs uppercase tracking-wide mb-2 font-semibold"><i class="fas fa-cog mr-1"></i>Batas Resmi</h4>
              <div class="flex justify-between text-sm"><span class="text-gray-400">Max RAM:</span><span class="font-bold text-white">${data.official_limits.max_ram}</span></div>
              <div class="flex justify-between text-sm"><span class="text-gray-400">Max Storage:</span><span class="font-bold text-white">${data.official_limits.max_storage}</span></div>
            </div>
          </div>
          ${data.official_limits.standard_variants.length > 0 ? `
          <div class="bg-gray-700/50 border border-gray-600 rounded-xl p-4">
            <h4 class="text-gray-400 text-xs uppercase tracking-wide mb-2 font-semibold"><i class="fas fa-list mr-1"></i>Varian Resmi</h4>
            <div class="flex flex-wrap gap-2">${data.official_limits.standard_variants.map(v => `<span class="bg-purple-600/30 text-purple-300 text-xs px-3 py-1 rounded-full">${v}</span>`).join('')}</div>
          </div>
          ` : ''}
          <div class="text-center text-gray-500 text-xs">
            <i class="fas fa-shield-alt mr-1"></i>IMEI: ${data.imei} | TAC Database: 248,373 entries
          </div>
        </div>`;
    }
  </script>
</body>
</html>
